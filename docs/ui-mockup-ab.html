<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Borglike Theme Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    /* ============================================================
       THEME LAB — faithful Borglike render, reskinned per theme.
       Structure (corners / edges / fill / shadow) travels WITH the
       theme via CSS vars, so each theme owns its contrast AND its
       frame convention. Swap any pane via the dropdown above it.
       ============================================================ */

    * { box-sizing: border-box; font-variant-numeric: tabular-nums; }
    html, body {
      margin: 0; height: 100%;
      background: #050507; color: #ccc;
      font-family: 'JetBrains Mono', monospace;
    }
    body { display: flex; flex-direction: column; overflow: hidden; }

    /* ---------- control bar ---------- */
    .controls {
      flex: 0 0 auto;
      display: flex; align-items: center; gap: 20px;
      padding: 10px 16px;
      background: #0d0d11; border-bottom: 1px solid #23232c;
      font-size: 12px;
    }
    .controls .title { font-weight: 700; letter-spacing: 1px; color: #e8e8ef; }
    .controls .group { display: flex; align-items: center; gap: 6px; }
    .controls label { color: #8a8a99; }
    .layout-btn {
      background: #16161d; border: 1px solid #2c2c38; color: #b8b8c6;
      padding: 4px 10px; border-radius: 4px; cursor: pointer; font: inherit; font-size: 12px;
    }
    .layout-btn.active { border-color: #6366f1; color: #fff; background: #1d1d2b; }
    .legend { margin-left: auto; display: flex; gap: 14px; color: #7a7a88; }
    .legend b { color: #b8b8c6; font-weight: 700; }

    /* ---------- lab grid ---------- */
    .lab {
      flex: 1 1 auto; overflow: auto;
      display: grid; gap: 14px; padding: 14px;
      align-content: start;
    }
    .lab.cols-1 { grid-template-columns: 1fr; }
    .lab.cols-2 { grid-template-columns: 1fr 1fr; }
    .lab.cols-4 { grid-template-columns: 1fr 1fr; }

    .pane { display: flex; flex-direction: column; min-width: 0; }
    .pane-bar {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 8px; background: #0d0d11;
      border: 1px solid #23232c; border-bottom: none;
      border-radius: 6px 6px 0 0; font-size: 11px;
    }
    .pane-bar .tier {
      font-size: 10px; text-transform: uppercase; letter-spacing: .08em;
      padding: 1px 6px; border-radius: 3px; font-weight: 700;
    }
    .tier.high { color: #ff5ea0; background: rgba(255,94,160,.13); }
    .tier.mid  { color: #7c9cff; background: rgba(124,156,255,.13); }
    .tier.low  { color: #7fcf9f; background: rgba(127,207,159,.13); }
    .pane-bar select {
      font: inherit; font-size: 11px; background: #16161d; color: #e0e0e8;
      border: 1px solid #2c2c38; border-radius: 4px; padding: 3px 6px; cursor: pointer;
    }

    /* The themed stage. Fixed design size; scaled to fit the cell. */
    .stage-clip { border: 1px solid #23232c; border-top: none; border-radius: 0 0 6px 6px; overflow: hidden; background: #000; }
    .cols-1 .stage-clip .stage { zoom: 1.0; }
    .cols-2 .stage-clip .stage { zoom: 0.82; }
    .cols-4 .stage-clip .stage { zoom: 0.56; }

    /* ============================================================
       FAITHFUL GAME RENDER — mirrors AppHeader / RunPanel /
       Sidebar / UpgradeList / EssenceCard / AppFeed.
       All colors & structure come from theme vars below.
       ============================================================ */
    .stage {
      width: 880px; height: 560px;
      display: grid;
      grid-template-rows: 44px 1fr 38px;
      grid-template-columns: 1fr 300px;
      grid-template-areas: "header header" "game sidebar" "feed feed";
      background: var(--bg);
      color: var(--text-primary);
      font-size: 13px;
      gap: 1px;
    }

    /* ---- header ---- */
    .app-header {
      grid-area: header; display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px; background: var(--bg-panel); border-bottom: 1px solid var(--border);
    }
    .h-left { display: flex; align-items: baseline; gap: 10px; }
    .logo { font-size: 18px; font-weight: 700; color: var(--essence); margin: 0; letter-spacing: .5px; }
    .tagline { font-size: 11px; color: var(--text-dim); }
    .essence-display {
      display: flex; align-items: center; gap: 8px;
      padding: 4px 14px; border-radius: var(--radius);
      background: color-mix(in srgb, var(--essence) 14%, transparent);
      border: 1px solid color-mix(in srgb, var(--essence) 32%, transparent);
    }
    .essence-display .gem { color: var(--essence); }
    .essence-display .val { color: var(--essence); font-weight: 700; font-size: 15px; }
    .essence-display .lab { color: var(--text-secondary); font-size: 11px; }
    .h-right { display: flex; gap: 8px; }
    .h-btn {
      display: flex; align-items: center; gap: 5px;
      padding: 4px 10px; border-radius: var(--radius);
      background: var(--bg-highlight); border: 1px solid var(--border);
      color: var(--text-secondary); font-size: 12px; cursor: default;
    }
    .h-btn.icon { padding: 4px 8px; }

    /* ---- run panel ---- */
    .run-panel {
      grid-area: game; display: flex; flex-direction: column; min-width: 0; min-height: 0;
      background: var(--pane-fill); border: 1px solid var(--border);
      border-top: var(--active-edge);
      border-radius: var(--radius); box-shadow: var(--pane-shadow);
      margin: 6px; overflow: hidden;
    }
    .run-header {
      display: flex; align-items: center; gap: 10px;
      padding: 6px 10px; border-bottom: 1px solid var(--border);
    }
    .run-class { font-weight: 700; color: var(--text-primary); }
    .run-race { color: var(--text-secondary); }
    .run-personality { color: var(--warning); font-size: 11px; padding: 1px 6px;
      border: 1px solid color-mix(in srgb, var(--warning) 40%, transparent); border-radius: var(--radius); }
    .run-depth { margin-left: auto; color: var(--text-secondary); font-size: 12px; }
    .run-depth b { color: var(--text-primary); }
    .run-ctrls { display: flex; gap: 4px; }
    .ctrl { width: 22px; height: 20px; display: grid; place-items: center;
      background: var(--bg-highlight); border: 1px solid var(--border); border-radius: var(--radius);
      color: var(--text-muted); font-size: 11px; }
    .ctrl.on { color: var(--accent); border-color: var(--accent); }

    .run-stats { display: flex; align-items: center; gap: 16px; padding: 6px 10px; }
    .bars { display: flex; flex-direction: column; gap: 4px; flex: 1; max-width: 360px; }
    .bar-row { display: flex; align-items: center; gap: 8px; }
    .bar-row .lab { width: 22px; font-size: 11px; color: var(--text-muted); }
    .bar { position: relative; flex: 1; height: 14px; background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden; }
    .bar .fill { position: absolute; inset: 0; border-radius: inherit; }
    .bar .fill.hp { background: var(--success); box-shadow: 0 0 6px color-mix(in srgb, var(--success) 40%, transparent); }
    .bar .fill.mp { background: var(--info); box-shadow: 0 0 6px color-mix(in srgb, var(--info) 40%, transparent); }
    .bar .txt { position: absolute; inset: 0; display: grid; place-items: center; font-size: 10px;
      color: var(--text-primary); font-weight: 700; mix-blend-mode: difference; }
    .stat-icons { display: flex; gap: 12px; font-size: 12px; }
    .stat-icons .s { display: flex; align-items: center; gap: 4px; color: var(--text-secondary); }
    .stat-icons .s.k { color: var(--danger); }
    .stat-icons .s.g { color: var(--warning); }
    .stat-icons .s.x { color: var(--info); }

    /* ---- dungeon ---- */
    .dungeon {
      flex: 1; min-height: 0; margin: 0 6px 6px; padding: 8px 10px;
      background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius);
      font-size: 15px; line-height: 1.12; letter-spacing: 1px; overflow: hidden;
      white-space: pre;
    }
    .dungeon .wall   { color: var(--text-dim); }
    .dungeon .floor  { color: color-mix(in srgb, var(--text-dim) 55%, var(--bg)); }
    .dungeon .player { color: var(--success); font-weight: 700; background: color-mix(in srgb, var(--accent) 30%, transparent); }
    .dungeon .mob    { color: var(--danger); font-weight: 700; }
    .dungeon .mob2   { color: var(--warning); font-weight: 700; }
    .dungeon .pot    { color: var(--info); }
    .dungeon .gold   { color: var(--warning); }
    .dungeon .scroll { color: var(--essence-light); }
    .dungeon .stair  { color: var(--text-secondary); font-weight: 700; }
    .dungeon .gem    { color: var(--legendary, var(--warning)); }

    /* ---- sidebar ---- */
    .sidebar { grid-area: sidebar; display: flex; flex-direction: column; min-height: 0;
      background: var(--bg-panel); border-left: 1px solid var(--border); }
    .side-tabs { display: flex; background: var(--bg-elevated); border-bottom: 1px solid var(--border); }
    .side-tab { flex: 1; padding: 8px 6px; text-align: center; font-size: 12px; color: var(--text-secondary);
      border-bottom: 2px solid transparent; cursor: default; }
    .side-tab.active { color: var(--essence); border-bottom-color: var(--essence); }
    .cat-tabs { display: flex; gap: 4px; padding: 6px; border-bottom: 1px solid var(--border); }
    .cat-tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
      padding: 5px 2px; font-size: 10px; color: var(--text-muted);
      background: var(--bg-highlight); border: 1px solid var(--border); border-radius: var(--radius); }
    .cat-tab .ci { font-size: 14px; }
    .cat-tab.active { color: var(--accent); border-color: var(--accent); }

    .cards { flex: 1; overflow: hidden; padding: 6px; display: flex; flex-direction: column; gap: 6px; }

    /* EssenceCard grammar: affordance carried by the cost pill + pips. */
    .ec {
      position: relative; display: grid; grid-template-columns: 30px 1fr auto;
      gap: 3px 10px; align-items: baseline; padding: 8px 10px;
      border: 1px solid transparent; border-radius: var(--radius);
      background: color-mix(in srgb, var(--bg-elevated) 60%, transparent);
    }
    .ec-icon { grid-area: 1 / 1 / 3 / 2; align-self: center; width: 30px; height: 30px;
      display: grid; place-items: center; background: var(--bg-highlight); border-radius: var(--radius);
      font-size: 16px; color: var(--text-muted); }
    .ec-name { grid-area: 1 / 2; font-weight: 700; font-size: 12px; color: var(--text-primary); }
    .ec-meta { grid-area: 1 / 3; justify-self: end; align-self: center; }
    .ec-sub { grid-area: 2 / 2; font-size: 11px; color: var(--text-muted); line-height: 1.35;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .ec-cost { grid-area: 2 / 3; justify-self: end; align-self: center; display: flex; align-items: center; gap: 4px;
      padding: 4px 8px; border-radius: var(--radius); font-size: 12px; font-weight: 700;
      background: var(--bg-highlight); border: 1px solid var(--border); color: var(--text-dim); }

    /* pips */
    .pips { display: inline-flex; align-items: center; gap: 8px; }
    .pip-row { display: inline-flex; gap: 3px; }
    .pip { width: 8px; height: 8px; border-radius: 1px; border: 1px solid var(--text-dim); overflow: hidden; }
    .pip .pf { display: block; height: 100%; background: var(--essence-light); }
    .pip.full { border-color: var(--essence-light); box-shadow: 0 0 4px color-mix(in srgb, var(--essence) 60%, transparent); }
    .pips .cnt { font-size: 10px; color: var(--text-dim); }

    /* affordance states */
    .ec.afford { cursor: pointer; background: color-mix(in srgb, var(--essence) 8%, transparent); }
    .ec.afford .ec-cost { background: color-mix(in srgb, var(--essence) 22%, transparent);
      border-color: var(--essence-light); color: #fff;
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--essence) 40%, transparent), 0 0 10px color-mix(in srgb, var(--essence) 30%, transparent); }
    .ec.cantafford .ec-name { color: var(--text-secondary); }
    .ec.maxed { opacity: .7; }
    .ec.maxed .ec-cost { display: none; }
    .ec.maxed .pip.full { border-color: var(--success); box-shadow: 0 0 4px color-mix(in srgb, var(--success) 60%, transparent); }
    .ec.maxed .pip .pf { background: var(--success); }
    .ec.maxed .cnt { color: var(--success); }
    .ec.fresh { animation: flush 1.6s ease-out infinite; }
    @keyframes flush {
      0%,100% { background: color-mix(in srgb, var(--essence) 8%, transparent); }
      25% { background: color-mix(in srgb, var(--essence) 32%, transparent); }
    }

    /* ---- feed ---- */
    .feed { grid-area: feed; display: flex; align-items: center; gap: 12px; padding: 0 16px;
      background: var(--bg-panel); border-top: 1px solid var(--border); overflow: hidden; }
    .feed .flabel { font-size: 11px; color: var(--text-dim); letter-spacing: .1em; }
    .feed .events { display: flex; gap: 22px; font-size: 11px; white-space: nowrap; overflow: hidden; }
    .feed .ev .slot { font-weight: 700; }
    .feed .ev .slot.s1 { color: var(--info); }
    .feed .ev .slot.sys { color: var(--text-dim); }
    .feed .ev .msg { color: var(--text-secondary); }
    .feed .ev.crit .msg { color: var(--danger); }
    .feed .expand { margin-left: auto; color: var(--text-dim); }

    /* ============================================================
       THEMES — 3 HIGH / 3 MID / 3 LOW.
       Structural tokens: --radius, --pane-fill, --pane-shadow,
       --active-edge (run-panel top edge accent).
       ============================================================ */

    /* ---------- HIGH CONTRAST: sharp 0px, hard borders, no shadow ---------- */
    .theme-high-contrast {
      --bg:#000000; --bg-panel:#050505; --bg-elevated:#0a0a0a; --bg-highlight:#161616;
      --border:#444444; --border-light:#666666;
      --accent:#00e5ff; --essence:#ff00aa; --essence-light:#ff66cc;
      --info:#00e5ff; --success:#00ff66; --warning:#ffcc00; --danger:#ff2222; --legendary:#ffee00;
      --text-primary:#ffffff; --text-secondary:#cccccc; --text-muted:#aaaaaa; --text-dim:#888888;
      --radius:0px; --pane-fill:var(--bg-panel); --pane-shadow:none; --active-edge:2px solid var(--accent);
    }
    .theme-green-phosphor {
      --bg:#020604; --bg-panel:#06100a; --bg-elevated:#0a160e; --bg-highlight:#102016;
      --border:#1f4a30; --border-light:#2f6a45;
      --accent:#33ff66; --essence:#9dff5a; --essence-light:#c8ff9e;
      --info:#33ffcc; --success:#33ff66; --warning:#ffd23a; --danger:#ff5a3a; --legendary:#eaff66;
      --text-primary:#d6ffe0; --text-secondary:#7fcf95; --text-muted:#569a6c; --text-dim:#356b45;
      --radius:0px; --pane-fill:var(--bg-panel); --pane-shadow:none; --active-edge:2px solid var(--accent);
    }
    .theme-amber-crt {
      --bg:#0a0703; --bg-panel:#15100a; --bg-elevated:#1d1610; --bg-highlight:#2a1f14;
      --border:#4a3520; --border-light:#6b4a2c;
      --accent:#ffb000; --essence:#ff8800; --essence-light:#ffa340;
      --info:#ffdd66; --success:#ccff66; --warning:#ff9933; --danger:#ff4422; --legendary:#fff066;
      --text-primary:#ffc870; --text-secondary:#c89758; --text-muted:#a17844; --text-dim:#7a5a30;
      --radius:0px; --pane-fill:var(--bg-panel); --pane-shadow:none; --active-edge:2px solid var(--accent);
    }

    /* ---------- MID: tight 4px radius, faint shadow, directional accent edge ---------- */
    .theme-dark-indigo {
      --bg:#0a0a12; --bg-panel:#12121f; --bg-elevated:#1a1a2e; --bg-highlight:#252540;
      --border:#3a3a5c; --border-light:#4a4a6a;
      --accent:#6366f1; --essence:#8b5cf6; --essence-light:#a78bfa;
      --info:#06b6d4; --success:#22c55e; --warning:#f59e0b; --danger:#ef4444; --legendary:#eab308;
      --text-primary:#e2e8f0; --text-secondary:#94a3b8; --text-muted:#7c8ca2; --text-dim:#64748b;
      --radius:4px; --pane-fill:var(--bg-panel); --pane-shadow:0 2px 8px rgba(0,0,0,.35); --active-edge:2px solid var(--accent);
    }
    .theme-crimson {
      --bg:#160f11; --bg-panel:#1e1518; --bg-elevated:#271b20; --bg-highlight:#332229;
      --border:#48303a; --border-light:#664450;
      --accent:#e85d75; --essence:#c08cf0; --essence-light:#d9b8f7;
      --info:#5fb0c4; --success:#7cc079; --warning:#e0a23c; --danger:#ff4d3a; --legendary:#f0c84a;
      --text-primary:#efdce0; --text-secondary:#c2a6ad; --text-muted:#9a7e86; --text-dim:#6e525b;
      --radius:4px; --pane-fill:var(--bg-panel); --pane-shadow:0 2px 8px rgba(0,0,0,.35); --active-edge:2px solid var(--accent);
    }
    .theme-gruvbox {
      --bg:#1d2021; --bg-panel:#282828; --bg-elevated:#32302f; --bg-highlight:#3c3836;
      --border:#504945; --border-light:#665c54;
      --accent:#fabd2f; --essence:#d3869b; --essence-light:#e6a4b9;
      --info:#83a598; --success:#b8bb26; --warning:#fe8019; --danger:#fb4934; --legendary:#fabd2f;
      --text-primary:#ebdbb2; --text-secondary:#d5c4a1; --text-muted:#b4a48a; --text-dim:#928374;
      --radius:4px; --pane-fill:var(--bg-panel); --pane-shadow:0 2px 8px rgba(0,0,0,.35); --active-edge:2px solid var(--accent);
    }

    /* ---------- LOW: soft 8px radius, glass gradient + drop shadow, muted ---------- */
    .theme-tokyo-night {
      --bg:#1a1b26; --bg-panel:#1f2233; --bg-elevated:#24283b; --bg-highlight:#2c3147;
      --border:#3b4261; --border-light:#545c7e;
      --accent:#7aa2f7; --essence:#bb9af7; --essence-light:#d2b8ff;
      --info:#7dcfff; --success:#9ece6a; --warning:#e0af68; --danger:#f7768e; --legendary:#ff9e64;
      --text-primary:#c0caf5; --text-secondary:#a9b1d6; --text-muted:#8088b0; --text-dim:#565f89;
      --radius:8px; --pane-fill:linear-gradient(135deg, color-mix(in srgb,var(--bg-elevated) 95%,transparent), color-mix(in srgb,var(--bg-panel) 98%,transparent));
      --pane-shadow:0 4px 14px rgba(0,0,0,.45); --active-edge:1px solid var(--border-light);
    }
    .theme-nord {
      --bg:#2e3440; --bg-panel:#353c4a; --bg-elevated:#3b4252; --bg-highlight:#434c5e;
      --border:#4c566a; --border-light:#5e6779;
      --accent:#88c0d0; --essence:#b48ead; --essence-light:#c8a0c0;
      --info:#81a1c1; --success:#a3be8c; --warning:#ebcb8b; --danger:#bf616a; --legendary:#d08770;
      --text-primary:#eceff4; --text-secondary:#d8dee9; --text-muted:#b0b8c7; --text-dim:#8893a5;
      --radius:8px; --pane-fill:linear-gradient(135deg, color-mix(in srgb,var(--bg-elevated) 95%,transparent), color-mix(in srgb,var(--bg-panel) 98%,transparent));
      --pane-shadow:0 4px 14px rgba(0,0,0,.45); --active-edge:1px solid var(--border-light);
    }
    .theme-rose-pine {
      --bg:#191724; --bg-panel:#1f1d2e; --bg-elevated:#26233a; --bg-highlight:#2a273f;
      --border:#393552; --border-light:#45406b;
      --accent:#ebbcba; --essence:#c4a7e7; --essence-light:#d9c4ee;
      --info:#9ccfd8; --success:#95b1ac; --warning:#f6c177; --danger:#eb6f92; --legendary:#f6c177;
      --text-primary:#e0def4; --text-secondary:#c4c0d4; --text-muted:#9995ad; --text-dim:#6e6a86;
      --radius:8px; --pane-fill:linear-gradient(135deg, color-mix(in srgb,var(--bg-elevated) 95%,transparent), color-mix(in srgb,var(--bg-panel) 98%,transparent));
      --pane-shadow:0 4px 14px rgba(0,0,0,.45); --active-edge:1px solid var(--border-light);
    }
  </style>
</head>
<body>
  <div class="controls">
    <span class="title">BORGLIKE · THEME LAB</span>
    <div class="group">
      <label>Layout</label>
      <button class="layout-btn" data-cols="1">1&times;1</button>
      <button class="layout-btn" data-cols="2">2-up</button>
      <button class="layout-btn active" data-cols="4">4-up</button>
    </div>
    <div class="legend">
      <span><b>Tiers</b> 3 high / 3 mid / 3 low contrast</span>
      <span><b>Cards</b> afford=lit pill · can't=neutral · maxed=green pips · fresh=pulse</span>
    </div>
  </div>

  <div class="lab cols-4" id="lab"></div>

  <!-- ===================== faithful game template ===================== -->
  <template id="game-tpl">
    <div class="stage">
      <!-- header -->
      <header class="app-header">
        <div class="h-left">
          <h1 class="logo">Borglike</h1>
          <span class="tagline">Idle Angband Inspired Incremental</span>
        </div>
        <div class="essence-display">
          <span class="gem">&#9670;</span>
          <span class="val">1,240</span>
          <span class="lab">Essence</span>
        </div>
        <div class="h-right">
          <span class="h-btn">&#10073;&#10073; Pause</span>
          <span class="h-btn">&#8635; Auto</span>
          <span class="h-btn icon">&#9776;</span>
          <span class="h-btn icon">&#9881;</span>
        </div>
      </header>

      <!-- run panel -->
      <section class="run-panel">
        <div class="run-header">
          <span class="run-class">Warrior</span>
          <span class="run-race">Dwarf</span>
          <span class="run-personality">CAU</span>
          <span class="run-depth">D:<b>8</b> &middot; Lv<b>11</b></span>
          <span class="run-ctrls">
            <span class="ctrl on">&#187;</span>
            <span class="ctrl">&#9974;</span>
            <span class="ctrl">&#9881;</span>
            <span class="ctrl">&#10005;</span>
          </span>
        </div>

        <div class="run-stats">
          <div class="bars">
            <div class="bar-row">

  <script>
    // ---- theme registry (tiered) ----
    const THEMES = [
      { id:'high-contrast',  name:'High Contrast',  tier:'high' },
      { id:'green-phosphor', name:'Green Phosphor',  tier:'high' },
      { id:'amber-crt',      name:'Amber CRT',       tier:'high' },
      { id:'dark-indigo',    name:'Dark Indigo',     tier:'mid'  },
      { id:'crimson',        name:'Crimson',         tier:'mid'  },
      { id:'gruvbox',        name:'Gruvbox',         tier:'mid'  },
      { id:'tokyo-night',    name:'Tokyo Night',     tier:'low'  },
      { id:'nord',           name:'Nord',            tier:'low'  },
      { id:'rose-pine',      name:'Rosé Pine',       tier:'low'  },
    ];
    const TIER_LABEL = { high:'HIGH', mid:'MID', low:'LOW' };

    // representative dungeon scene; colorized per char class so the grid
    // recolors with the theme (mirrors the engine's per-entity glyph colors).
    const MAP = [
      "  ###########                      ",
      "  #....!....#      #############    ",
      "  #.........#######......o....#     ",
      "  #....@..........#.......$...#     ",
      "  #.........#     #...!.......#     ",
      "  #...k.....#     #......?....#     ",
      "  ###.#######     #.........<.#     ",
      "    #.#           #####.#######     ",
      "    #.#################.#           ",
      "  ###................d.#           ",
      "  #....*.........#######           ",
      "  #.......>......#                 ",
      "  ################                 ",
    ];
    const CLS = {
      '#':'wall','.':'floor','@':'player','k':'mob','o':'mob','d':'mob2',
      '!':'pot','$':'gold','?':'scroll','<':'stair','>':'stair','*':'gem'
    };
    function renderMap() {
      let html = '';
      for (const row of MAP) {
        for (const ch of row) {
          if (ch === ' ') { html += ' '; continue; }
          const c = CLS[ch];
          html += c ? `<span class="${c}">${ch}</span>` : ch;
        }
        html += '\n';
      }
      return html;
    }

    const lab = document.getElementById('lab');
    const tpl = document.getElementById('game-tpl');

    function makePane(themeId) {
      const theme = THEMES.find(t => t.id === themeId);
      const pane = document.createElement('div');
      pane.className = 'pane';

      const bar = document.createElement('div');
      bar.className = 'pane-bar';
      const tier = document.createElement('span');
      tier.className = 'tier ' + theme.tier;
      tier.textContent = TIER_LABEL[theme.tier];
      const sel = document.createElement('select');
      ['high','mid','low'].forEach(tg => {
        const og = document.createElement('optgroup');
        og.label = TIER_LABEL[tg] + ' contrast';
        THEMES.filter(t => t.tier === tg).forEach(t => {
          const o = document.createElement('option');
          o.value = t.id; o.textContent = t.name;
          if (t.id === themeId) o.selected = true;
          og.appendChild(o);
        });
        sel.appendChild(og);
      });
      bar.appendChild(tier);
      bar.appendChild(sel);

      const clip = document.createElement('div');
      clip.className = 'stage-clip';
      const frag = tpl.content.cloneNode(true);
      frag.querySelector('[data-map]').innerHTML = renderMap();
      const stage = frag.querySelector('.stage');
      stage.classList.add('theme-' + themeId);
      clip.appendChild(frag);

      sel.addEventListener('change', () => {
        const t = THEMES.find(x => x.id === sel.value);
        stage.className = 'stage theme-' + t.id;
        tier.className = 'tier ' + t.tier;
        tier.textContent = TIER_LABEL[t.tier];
      });

      pane.appendChild(bar);
      pane.appendChild(clip);
      return pane;
    }

    // default 4-up: one of each tier + a high anchor, A (tokyo glass) dropped from lead
    const DEFAULTS = ['high-contrast','amber-crt','dark-indigo','tokyo-night'];
    function build(cols) {
      lab.innerHTML = '';
      const ids = DEFAULTS.slice(0, cols === 1 ? 1 : cols === 2 ? 2 : 4);
      ids.forEach(id => lab.appendChild(makePane(id)));
    }
    build(4);

    document.querySelectorAll('.layout-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.layout-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const cols = +btn.dataset.cols;
        lab.className = 'lab cols-' + cols;
        build(cols);
      });
    });
  </script>
</body>
