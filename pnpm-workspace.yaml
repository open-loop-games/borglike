# Build-script approval. pnpm renamed this between majors, so we declare both:
#   pnpm 11+ reads `allowBuilds` (map); pnpm 10 reads `onlyBuiltDependencies` (list).
# Each side ignores the other's key, so this is safe for either local pnpm.
allowBuilds:
  esbuild: true
  vue-demi: true
onlyBuiltDependencies:
  - esbuild
  - vue-demi
